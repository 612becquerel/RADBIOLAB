<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seeding">
<meta name="theme-color" content="#0E141A">
<title>Seeding — Master Mix 계산</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230E141A'/%3E%3Crect x='62' y='28' width='56' height='124' rx='10' fill='none' stroke='%232B3742' stroke-width='7'/%3E%3Crect x='69' y='96' width='42' height='49' rx='5' fill='%23F0637E'/%3E%3Crect x='69' y='118' width='42' height='27' rx='5' fill='%2345C8DE'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0E141A;
    --panel:#161E26;
    --panel-2:#1C262F;
    --line:#2B3742;
    --line-soft:#222D37;
    --ink:#E9F0F6;
    --ink-dim:#8A9AA8;
    --ink-faint:#5F6E7B;
    --cyan:#45C8DE;
    --phenol:#F0637E;
    --amber:#F2A93B;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.45;
    padding:
      calc(env(safe-area-inset-top) + 22px)
      calc(env(safe-area-inset-right) + 18px)
      calc(env(safe-area-inset-bottom) + 44px)
      calc(env(safe-area-inset-left) + 18px);
    max-width:560px;margin:0 auto;
  }

  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px;
  }
  h1{font-size:23px;font-weight:650;letter-spacing:-.01em;margin:0 0 26px}

  .card{
    background:var(--panel);border:1px solid var(--line-soft);
    border-radius:14px;padding:16px 15px 17px;margin-bottom:14px;
  }
  .card-head{display:flex;align-items:baseline;gap:9px;margin-bottom:14px}
  .step{
    font-family:var(--mono);font-size:11px;color:var(--bg);
    background:var(--ink-faint);border-radius:4px;padding:2px 6px;letter-spacing:.04em;
  }
  .card-title{font-size:15px;font-weight:600;letter-spacing:-.005em}

  .lbl{
    display:block;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.11em;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:6px;
  }

  .field{position:relative}
  input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;color:var(--ink);font-family:var(--mono);font-size:17px;
    padding:11px 48px 11px 12px;outline:none;transition:border-color .12s ease;
  }
  input.wide-unit{padding-right:84px}
  input[type=text]:focus{border-color:var(--cyan)}
  input[type=text]:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
  .unit{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:12px;color:var(--ink-faint);pointer-events:none;
  }
  .row{display:grid;gap:11px}
  .row.two{grid-template-columns:1fr 1fr}

  .seg{
    display:grid;grid-template-columns:1fr 1fr;gap:4px;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;padding:4px;
  }
  .seg button{
    appearance:none;background:transparent;border:0;border-radius:6px;
    color:var(--ink-dim);font-family:var(--sans);font-size:14px;font-weight:500;
    padding:8px 4px;cursor:pointer;transition:background .12s ease, color .12s ease;
  }
  .seg button[aria-pressed=true]{background:var(--line);color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
  .seg.sub{margin-top:8px}
  .seg.sub button{font-family:var(--mono);font-size:13px;padding:6px 4px}
  .seg.mini button{font-family:var(--mono);font-size:12px;padding:5px 4px}

  .stepper{
    display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;overflow:hidden;
  }
  .stepper button{
    appearance:none;background:transparent;border:0;color:var(--ink-dim);
    font-size:21px;line-height:1;padding:11px 0;cursor:pointer;
  }
  .stepper button:active{background:var(--line)}
  .stepper button:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
  .stepper input{border:0;background:transparent;text-align:center;padding:11px 0;border-radius:0}
  .stepper input:focus{border-color:transparent}

  .hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-top:7px;line-height:1.7}
  .hint b{color:var(--cyan);font-weight:500}

  .prefs{margin-top:15px;padding-top:15px;border-top:1px solid var(--line-soft)}
  .prefs .block{margin-top:13px}

  .grand{padding-bottom:14px;border-bottom:1px solid var(--line)}
  .grand-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .grand-sub{
    font-family:var(--mono);font-size:12.5px;color:var(--cyan);
    margin-top:7px;text-align:right;
  }
  .grand-sub em{font-style:normal;color:var(--ink-faint)}
  .grand-lbl{font-size:14px;color:var(--ink-dim)}
  .grand-val{
    font-family:var(--mono);font-size:34px;font-weight:600;
    letter-spacing:-.025em;font-variant-numeric:tabular-nums;
  }
  .grand-val .u{font-size:13px;color:var(--ink-faint);margin-left:5px;letter-spacing:0;font-weight:400}

  .split-lbl{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-dim);margin:15px 0 2px;
  }
  .out{padding:10px 0}
  .out + .out{border-top:1px solid var(--line-soft)}
  .out-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .out-name{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dim)}
  .swatch{width:9px;height:9px;border-radius:2px;flex:none}
  .sw-cell{background:var(--cyan)}
  .sw-media{background:var(--phenol)}
  .out-val{
    font-family:var(--mono);font-size:25px;font-weight:500;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  }
  .out-val .u{font-size:12px;color:var(--ink-faint);margin-left:4px;letter-spacing:0}
  .out-sub{
    font-family:var(--mono);font-size:12px;color:var(--cyan);
    margin-top:5px;padding-left:17px;opacity:.85;
  }
  .out-sub em{font-style:normal;color:var(--ink-faint)}

  .vessel{margin:14px 0 4px}
  .bar{
    display:flex;height:34px;border-radius:6px;overflow:hidden;
    background:var(--panel-2);border:1px solid var(--line);
  }
  .bar span{display:block;height:100%;transition:width .25s cubic-bezier(.4,0,.2,1)}
  .bar .b-cell{background:var(--cyan)}
  .bar .b-media{background:var(--phenol);opacity:.85}
  .ticks{
    display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;color:var(--ink-faint);margin-top:6px;
  }

  .calc{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
  .calc-title{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-dim);margin:0 0 9px;
  }
  .cstep{padding:8px 0}
  .cstep + .cstep{border-top:1px dashed var(--line-soft)}
  .cstep-name{font-size:12px;color:var(--ink-faint);margin-bottom:3px}
  .cstep-body{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;font-family:var(--mono);font-size:12.5px;flex-wrap:wrap;
  }
  .expr{color:var(--ink-dim)}
  .res{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .cstep.key{
    background:var(--panel-2);border-radius:8px;
    padding:9px 11px;margin:6px 0;border-top:0;
  }
  .cstep.key + .cstep{border-top:1px dashed var(--line-soft)}
  .cstep.key .res{color:var(--cyan);font-size:14px;font-weight:500}
  .cstep.key .cstep-name{color:var(--ink-dim)}

  .warn{
    display:none;border-radius:9px;padding:11px 12px;font-size:13px;
    line-height:1.5;margin-top:14px;
    background:rgba(242,169,59,.1);border:1px solid rgba(242,169,59,.35);color:var(--amber);
  }
  .warn.on{display:block}
  .warn.stop{background:rgba(240,99,126,.1);border-color:rgba(240,99,126,.4);color:var(--phenol)}

  .empty{text-align:center;color:var(--ink-faint);font-size:13.5px;padding:26px 10px}
  .hidden{display:none}

  .gloss{
    font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
    line-height:1.85;margin:0 4px 8px;
  }
  .gloss b{color:var(--ink-dim);font-weight:500}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>

<p class="eyebrow">Cell seeding</p>
<h1>Master Mix 계산</h1>

<!-- ① 세포 현탁액 -->
<section class="card">
  <div class="card-head"><span class="step">1</span><span class="card-title">세포 현탁액</span></div>

  <div class="seg" style="margin-bottom:13px">
    <button type="button" id="mode-a" aria-pressed="true">부피 + 세포수</button>
    <button type="button" id="mode-b" aria-pressed="false">농도 직접 입력</button>
  </div>

  <div id="pane-a" class="row two">
    <div>
      <label class="lbl" for="i-vol">부피</label>
      <div class="field">
        <input type="text" id="i-vol" inputmode="decimal" autocomplete="off" value="4">
        <span class="unit">mL</span>
      </div>
    </div>
    <div>
      <label class="lbl" for="i-count">세포수</label>
      <div class="field">
        <input type="text" id="i-count" autocomplete="off" autocapitalize="off" spellcheck="false" value="1E6">
        <span class="unit">cells</span>
      </div>
    </div>
  </div>

  <div id="pane-b" class="hidden">
    <label class="lbl" for="i-conc">농도</label>
    <div class="field">
      <input type="text" id="i-conc" class="wide-unit" autocomplete="off" autocapitalize="off" spellcheck="false" value="2.5E5">
      <span class="unit">cells/mL</span>
    </div>
  </div>

  <p class="hint" id="h-conc">현탁액 농도 <b>—</b></p>
</section>

<!-- ② 용기 -->
<section class="card">
  <div class="card-head"><span class="step">2</span><span class="card-title">용기</span></div>

  <div class="seg">
    <button type="button" id="v-flask" aria-pressed="true">T-flask</button>
    <button type="button" id="v-mylar" aria-pressed="false">Mylar dish</button>
  </div>
  <div class="seg sub" id="sub-flask">
    <button type="button" id="v-t25" aria-pressed="true">25 cm²</button>
    <button type="button" id="v-t75" aria-pressed="false">75 cm²</button>
  </div>

  <div style="margin-top:13px">
    <label class="lbl" for="i-n">개수</label>
    <div class="stepper">
      <button type="button" id="n-minus" aria-label="개수 줄이기">−</button>
      <input type="text" id="i-n" inputmode="numeric" autocomplete="off" value="2">
      <button type="button" id="n-plus" aria-label="개수 늘리기">+</button>
    </div>
  </div>

  <div class="prefs">
    <div class="row two">
      <div>
        <label class="lbl" for="i-per">용기당 부피</label>
        <div class="field"><input type="text" id="i-per" inputmode="decimal" autocomplete="off" value="7.2"><span class="unit">mL</span></div>
      </div>
      <div>
        <label class="lbl" for="i-sf">여유 배수</label>
        <div class="field"><input type="text" id="i-sf" inputmode="decimal" autocomplete="off" value="1.2"><span class="unit">×</span></div>
      </div>
    </div>

    <div class="block">
      <label class="lbl">목표 기준</label>
      <div class="seg">
        <button type="button" id="t-dens" aria-pressed="true">밀도</button>
        <button type="button" id="t-cells" aria-pressed="false">용기당 세포수</button>
      </div>
      <div class="field" style="margin-top:9px">
        <input type="text" id="i-target" class="wide-unit" autocomplete="off" autocapitalize="off" spellcheck="false" value="2.5E4">
        <span class="unit" id="u-target">cells/mL</span>
      </div>
    </div>

    <div class="block">
      <label class="lbl">배지 보정 단위</label>
      <div class="seg mini">
        <button type="button" id="g-05" aria-pressed="true">0.5 mL</button>
        <button type="button" id="g-01" aria-pressed="false">0.1 mL</button>
      </div>
    </div>
  </div>

  <p class="hint" id="h-vessel">—</p>
</section>

<!-- ③ MMT / MMM -->
<section class="card">
  <div class="card-head"><span class="step">3</span><span class="card-title" id="mm-title">MMT</span></div>

  <div id="r-empty" class="empty">숫자를 입력하면 여기에 결과가 나옵니다.</div>

  <div id="r-body" class="hidden">
    <div class="grand">
      <div class="grand-top">
        <span class="grand-lbl">총 <span id="mm-name">MMT</span></span>
        <span class="grand-val" id="o-total">—<span class="u">mL</span></span>
      </div>
      <div class="grand-sub" id="o-percell"></div>
    </div>

    <p class="split-lbl">구성</p>
    <div class="out">
      <div class="out-top">
        <span class="out-name"><i class="swatch sw-cell"></i>세포 현탁액</span>
        <span class="out-val" id="o-cell">—<span class="u">mL</span></span>
      </div>
      <div class="out-sub" id="o-cell-sub"></div>
    </div>
    <div class="out">
      <div class="out-top">
        <span class="out-name"><i class="swatch sw-media"></i>배지</span>
        <span class="out-val" id="o-media">—<span class="u">mL</span></span>
      </div>
      <div class="out-sub" id="o-media-sub"></div>
    </div>

    <div class="vessel">
      <div class="bar">
        <span class="b-cell" id="bar-cell" style="width:0%"></span>
        <span class="b-media" id="bar-media" style="width:100%"></span>
      </div>
      <div class="ticks"><span>0</span><span id="tick-mid">—</span><span id="tick-end">—</span></div>
    </div>

    <div class="calc">
      <p class="calc-title">계산 과정</p>
      <div class="seg mini" style="margin-bottom:9px">
        <button type="button" id="c-raw" aria-pressed="false">보정 전</button>
        <button type="button" id="c-adj" aria-pressed="true">보정 후</button>
      </div>
      <div id="calc-rows"></div>
    </div>

    <div class="warn" id="o-warn"></div>
  </div>
</section>

<p class="gloss">
  <b>MMT</b> — Master Mix for T-flask<br>
  <b>MMM</b> — Master Mix for Mylar
</p>

<script>
(function(){
  "use strict";

  var PRESET = {
    t25:   { per:"7.2",  dens:"2.5E4",  label:"T25" },
    t75:   { per:"21.6", dens:"2.5E4",  label:"T75" },
    mylar: { per:"2",    dens:"1.75E5", label:"Mylar dish" }
  };

  var mode = "a";
  var vessel = "t25";
  var flaskSize = "t25";
  var target = "dens";
  var grid = 0.5;        // 배지 보정 단위
  var calcView = "adj";  // raw | adj

  var $ = function(id){ return document.getElementById(id); };

  function num(el){
    var raw = (el.value || "").trim().replace(/,/g,"").replace(/\s+/g,"");
    if (!raw) return NaN;
    var v = parseFloat(raw);
    return isFinite(v) ? v : NaN;
  }

  var SUP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"};
  function sci(x){
    if (!isFinite(x) || x <= 0) return "—";
    var e = Math.floor(Math.log10(x));
    var m = x / Math.pow(10, e);
    if (m >= 9.995){ m = m/10; e += 1; }
    var exp = String(e).split("").map(function(c){ return SUP[c] || c; }).join("");
    return m.toFixed(2) + "×10" + exp;
  }
  function vol(x){
    if (!isFinite(x)) return "—";
    if (Math.abs(x) >= 100) return x.toFixed(1);
    if (Math.abs(x) >= 10)  return x.toFixed(2);
    return x.toFixed(3);
  }
  function gvol(x){ return (grid === 0.5) ? x.toFixed(1) : x.toFixed(1); }
  function setPressed(onEl, offEl){
    onEl.setAttribute("aria-pressed","true");
    offEl.setAttribute("aria-pressed","false");
  }
  function mmName(){ return vessel === "mylar" ? "MMM" : "MMT"; }

  // P1000: 1 mL 단위로 나눠 균등 분주
  function splitP1000(v){
    if (!isFinite(v) || v <= 1.0 + 1e-9) return "";
    var draws = Math.ceil(v - 1e-9);
    var each = Math.round(v / draws * 1000);
    return each + " µL × " + draws + "회";
  }
  // P5000: 5 mL 단위로 균등 분주, 안 떨어지면 5 mL 반복 + 나머지
  function splitP5000(v){
    if (!isFinite(v) || v <= 5.0 + 1e-9) return "";
    var draws = Math.ceil(v / 5 - 1e-9);
    var each = v / draws;
    if (Math.abs(each * 2 - Math.round(each * 2)) < 1e-6){
      return each.toFixed(1) + " mL × " + draws + "회";
    }
    var full = Math.floor(v / 5 - 1e-9);
    var rem = v - full * 5;
    return "5.0 mL × " + full + "회 + " + rem.toFixed(1) + " mL";
  }

  // --- 현탁액 입력 모드 ---
  $("mode-a").addEventListener("click", function(){
    mode = "a"; setPressed($("mode-a"), $("mode-b"));
    $("pane-a").classList.remove("hidden"); $("pane-b").classList.add("hidden");
    render();
  });
  $("mode-b").addEventListener("click", function(){
    mode = "b"; setPressed($("mode-b"), $("mode-a"));
    $("pane-b").classList.remove("hidden"); $("pane-a").classList.add("hidden");
    render();
  });

  // --- 목표 기준 ---
  function setTarget(kind){
    var per = num($("i-per")), cur = num($("i-target"));
    target = kind;
    if (kind === "dens"){
      setPressed($("t-dens"), $("t-cells"));
      $("u-target").textContent = "cells/mL";
      if (isFinite(cur) && isFinite(per) && per > 0) $("i-target").value = (cur / per).toPrecision(3);
    } else {
      setPressed($("t-cells"), $("t-dens"));
      $("u-target").textContent = "cells/용기";
      if (isFinite(cur) && isFinite(per) && per > 0) $("i-target").value = (cur * per).toPrecision(3);
    }
    render();
  }
  $("t-dens").addEventListener("click", function(){ if (target !== "dens") setTarget("dens"); });
  $("t-cells").addEventListener("click", function(){ if (target !== "cells") setTarget("cells"); });

  // --- 보정 단위 ---
  $("g-05").addEventListener("click", function(){ grid = 0.5; setPressed($("g-05"), $("g-01")); render(); });
  $("g-01").addEventListener("click", function(){ grid = 0.1; setPressed($("g-01"), $("g-05")); render(); });

  // --- 계산 과정 보기 ---
  $("c-raw").addEventListener("click", function(){ calcView = "raw"; setPressed($("c-raw"), $("c-adj")); render(); });
  $("c-adj").addEventListener("click", function(){ calcView = "adj"; setPressed($("c-adj"), $("c-raw")); render(); });

  // --- 용기 ---
  function applyPreset(kind){
    vessel = kind;
    var p = PRESET[kind];
    $("i-per").value = p.per;
    $("i-target").value = (target === "dens")
      ? p.dens
      : (parseFloat(p.dens) * parseFloat(p.per)).toPrecision(3);
    render();
  }
  $("v-flask").addEventListener("click", function(){
    setPressed($("v-flask"), $("v-mylar"));
    $("sub-flask").classList.remove("hidden");
    applyPreset(flaskSize);
  });
  $("v-mylar").addEventListener("click", function(){
    setPressed($("v-mylar"), $("v-flask"));
    $("sub-flask").classList.add("hidden");
    applyPreset("mylar");
  });
  $("v-t25").addEventListener("click", function(){
    flaskSize = "t25"; setPressed($("v-t25"), $("v-t75")); applyPreset("t25");
  });
  $("v-t75").addEventListener("click", function(){
    flaskSize = "t75"; setPressed($("v-t75"), $("v-t25")); applyPreset("t75");
  });

  // --- 개수 ---
  function bump(d){
    var n = parseInt($("i-n").value, 10);
    if (!isFinite(n)) n = 1;
    n = Math.max(1, Math.min(999, n + d));
    $("i-n").value = String(n);
    render();
  }
  $("n-minus").addEventListener("click", function(){ bump(-1); });
  $("n-plus").addEventListener("click", function(){ bump(1); });

  ["i-vol","i-count","i-conc","i-n","i-per","i-target","i-sf"].forEach(function(id){
    $(id).addEventListener("input", render);
  });

  function step(name, expr, res, key){
    return '<div class="cstep' + (key ? ' key' : '') + '">' +
             '<div class="cstep-name">' + name + '</div>' +
             '<div class="cstep-body"><span class="expr">' + expr + '</span>' +
             '<span class="res">' + res + '</span></div>' +
           '</div>';
  }

  function render(){
    var mm = mmName();
    $("mm-title").textContent = mm;
    $("mm-name").textContent = mm;

    var warn = $("o-warn");
    warn.className = "warn";
    warn.textContent = "";

    // 현탁액 농도
    var cStock, vAvail = NaN;
    if (mode === "a"){
      vAvail = num($("i-vol"));
      var cells = num($("i-count"));
      cStock = (vAvail > 0 && cells > 0) ? cells / vAvail : NaN;
    } else {
      cStock = num($("i-conc"));
    }
    $("h-conc").innerHTML = "현탁액 농도 <b>" +
      (isFinite(cStock) && cStock > 0 ? sci(cStock) + " cells/mL" : "—") + "</b>";

    // 용기 조건
    var n   = parseInt($("i-n").value, 10);
    var per = num($("i-per"));
    var sf  = num($("i-sf"));
    var tv  = num($("i-target"));
    if (!isFinite(sf) || sf <= 0) sf = 1;

    var dens = NaN, perVesselCells = NaN;
    if (isFinite(tv) && tv > 0 && isFinite(per) && per > 0){
      if (target === "dens"){ dens = tv; perVesselCells = tv * per; }
      else { perVesselCells = tv; dens = tv / per; }
    }

    var ok = isFinite(cStock) && cStock > 0 && isFinite(n) && n > 0 &&
             isFinite(per) && per > 0 && isFinite(dens) && dens > 0;

    $("h-vessel").innerHTML = ok
      ? PRESET[vessel].label + " " + n + "개 · 용기당 " + vol(per) + " mL<br>" +
        "용기당 목표 세포수 " + sci(perVesselCells) + " cells · 목표 밀도 " + sci(dens) + " cells/mL"
      : "—";

    if (!ok){
      $("r-empty").classList.remove("hidden");
      $("r-body").classList.add("hidden");
      return;
    }
    $("r-empty").classList.add("hidden");
    $("r-body").classList.remove("hidden");

    // --- 보정 전 ---
    var vNet    = n * per;
    var vTotal0 = vNet * sf;
    var need    = vTotal0 * dens;
    var vCell0  = need / cStock;
    var vMedia0 = vTotal0 - vCell0;

    // --- 보정 후 ---
    // 배지를 grid 단위로 반올림한 뒤, 목표 밀도가 유지되도록 현탁액을 역산
    // 현탁액 : 배지 = 1 : k,  k = (cStock − dens) / dens
    var k = (cStock - dens) / dens;
    var vMedia = Math.round(vMedia0 / grid) * grid;
    if (vMedia < 0) vMedia = 0;
    vMedia = parseFloat(vMedia.toFixed(2));

    var vCellExact = (k > 0) ? vMedia / k : vCell0;

    // P1000 실사용: 1 mL 단위로 균등 분할, µL 단위로 양자화
    var cDraws = Math.max(1, Math.ceil(vCellExact - 1e-9));
    var cEach  = Math.round(vCellExact / cDraws * 1000);   // µL
    var vCell  = cEach * cDraws / 1000;

    var vTotal     = vCell + vMedia;
    var densActual = (vCell * cStock) / vTotal;
    var cellsPerVessel = densActual * per;

    // 표시는 보정 후 기준
    $("o-total").innerHTML = vol(vTotal) + '<span class="u">mL</span>';
    $("o-cell").innerHTML  = vol(vCell)  + '<span class="u">mL</span>';
    $("o-media").innerHTML = gvol(vMedia) + '<span class="u">mL</span>';
    $("o-percell").innerHTML = "용기당 " + sci(cellsPerVessel) + " cells " +
                               "<em>· 목표 " + sci(perVesselCells) + "</em>";

    var cs = (vCell > 1.0 + 1e-9) ? (cEach + " µL × " + cDraws + "회") : "";
    var ms = splitP5000(vMedia);
    var mPip = (vMedia <= 1.0 + 1e-9) ? "P1000" : "P5000";
    $("o-cell-sub").innerHTML  = cs ? cs + ' <em>· P1000</em>' : '<em>P1000 1회</em>';
    $("o-media-sub").innerHTML = ms ? ms + ' <em>· P5000</em>' : '<em>' + mPip + ' 1회</em>';

    var pct = Math.max(0, Math.min(100, (vCell / vTotal) * 100));
    $("bar-cell").style.width  = pct + "%";
    $("bar-media").style.width = (100 - pct) + "%";
    $("tick-mid").textContent  = vol(vTotal/2);
    $("tick-end").textContent  = vol(vTotal) + " mL";

    // --- 계산 과정 ---
    var rows;
    if (calcView === "raw"){
      rows =
        step("실사용", vol(per) + " mL × " + n + "개", vol(vNet) + " mL") +
        step("여유 배수 적용 → 총 " + mm, vol(vNet) + " mL × " + sf, vol(vTotal0) + " mL", true) +
        step("필요 세포수", vol(vTotal0) + " mL × " + sci(dens) + " cells/mL", sci(need) + " cells", true) +
        step("필요 세포 현탁액 양", sci(need) + " ÷ " + sci(cStock) + " cells/mL", vol(vCell0) + " mL") +
        step("필요 배지 양", vol(vTotal0) + " − " + vol(vCell0) + " mL", vol(vMedia0) + " mL");
    } else {
      rows =
        step("보정 전 배지 양", "", vol(vMedia0) + " mL") +
        step(grid.toFixed(1) + " mL 단위 보정", vol(vMedia0) + " → 반올림", gvol(vMedia) + " mL", true) +
        step("희석비 (현탁액 : 배지)", "(" + sci(cStock) + " − " + sci(dens) + ") ÷ " + sci(dens), "1 : " + k.toFixed(2)) +
        step("현탁액 재계산", gvol(vMedia) + " mL ÷ " + k.toFixed(2), vol(vCell) + " mL", true) +
        step("총 " + mm, vol(vCell) + " + " + gvol(vMedia) + " mL", vol(vTotal) + " mL") +
        step("용기당 실제 세포수", vol(per) + " mL × " + sci(densActual) + " cells/mL", sci(cellsPerVessel) + " cells", true);
    }
    $("calc-rows").innerHTML = rows;

    // --- 경고 ---
    if (cStock <= dens){
      warn.className = "warn on stop";
      warn.textContent = "현탁액 농도가 목표 밀도보다 낮습니다. 이대로는 희석이 불가능하니 원심분리로 농축하세요.";
    } else if (mode === "a" && isFinite(vAvail) && vCell > vAvail){
      warn.className = "warn on stop";
      warn.textContent = "현탁액이 부족합니다. " + vol(vCell) + " mL가 필요한데 " + vol(vAvail) + " mL뿐입니다 (" + vol(vCell - vAvail) + " mL 부족).";
    } else if (vTotal < vNet){
      warn.className = "warn on stop";
      warn.textContent = "보정 후 총량 " + vol(vTotal) + " mL가 실사용량 " + vol(vNet) + " mL보다 적습니다. 여유 배수를 올리거나 보정 단위를 0.1 mL로 바꾸세요.";
    } else if (vCell < 0.02){
      warn.className = "warn on";
      warn.textContent = "필요 현탁액 양이 " + vol(vCell) + " mL로 너무 적어 피펫팅 오차가 큽니다. 현탁액을 한 번 희석한 뒤 다시 계산하세요.";
    } else if (mode === "a" && isFinite(vAvail) && vCell > vAvail * 0.9){
      warn.className = "warn on";
      warn.textContent = "현탁액을 거의 다 씁니다 (" + Math.round(vCell / vAvail * 100) + "%). 여유가 거의 없습니다.";
    }
  }

  render();
})();
</script>
</body>
</html>
